plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.qariahmountpump'
version = '0.1.0'

android {
  namespace "expo.modules.qariahmountpump"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // FabricUIManager's listener and UIManagerHelper (compile only at build time;
  // the app provides React Native at run time).
  implementation "com.facebook.react:react-android"
}
