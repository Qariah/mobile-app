# PLY-06 (TECH_DEBT #258) — the queue shows a remove ✕ on a row that does not play,
# and the ✕ removes that track only.
#
# Guards the defect in 3.2.2 (2579) and earlier: no queue row showed its ✕. The track
# row took the full row width and pushed the ✕ past the right edge of the screen.
# Fixed in components/player/v2/PlayerContent/QueueList.tsx (a flex: 1, minWidth: 0
# wrapper around the row content); the ✕ has testID `queue-remove-<index>` and the
# queue control has testID `player-queue-button`.
#
# Since Pass D (Sprint 52) upstream's queue shows the playing indicator, not a ✕, on
# the current row, so `queue-remove-0` exists only when the current row is not row 0.
# The flow therefore makes a playlist of two surahs and plays the first one: the queue
# has two tracks, row 0 plays, and row 1 ("Up Next") has `queue-remove-1`. It opens the
# queue, reads "2 tracks", checks that `queue-remove-0` is NOT on screen (the current
# row) and that `queue-remove-1` is, taps it, and reads "1 track". The count falls by
# one and the current track keeps playing (the mini player stays).
#
# Both platforms since Sprint 50: before it, the iOS full player sheet was one opaque
# a11y element ("Bottom Sheet"), and the queue steps ran on Android only.
#
# Order-independent: `clearState` at entry (CLAUDE.md, "Maestro runs flows in
# DIRECTORY order"). Needs a build with the testIDs above (Sprint 46 or later).
# Written in Sprint 52 Task 1b; not yet run on a device (Tier 2, queued).
appId: com.qariah.app
tags:
  - regression
  - player
---
- launchApp:
    clearState: true
- runFlow: ../../../subflows/skip-onboarding.yaml

# 1. Make a playlist, starting with Hud (A'tii Qah Suhaimi). Same steps as
#    player/playlist-session-restore.yaml, which passes on both platforms.
- tapOn: '.*Listen'
- tapOn: '(Qariahs|Reciters)'  # the Browse by tile; "Reciters" before #535
# Sprint 52: select the qariah by name. Pass D changed the grid order (the
# first cell is no longer A'tii Qah Suhaimi), and since Sprint 50 each card is
# its own accessibility element on iOS too.
- tapOn: '.*Suhaimi.*'
- extendedWaitUntil:
    visible: '.*JUZ.*'
    timeout: 10000
- assertVisible: '.*Suhaimi.*'
- tapOn:
    text: 'More options'
    index: 0
- tapOn: '.*Add to Collection'
- tapOn: '.*Create New Playlist'
- tapOn: 'e.g., Morning Recitations'
- inputText: 'QTest'
- tapOn: 'Save'
- tapOn:
    point: 50%,10%

# 1b. Add a second surah (row 1) to the same playlist. Same steps as
#     store-screenshots/subflows/add-to-playlist.yaml (NEW = false).
- tapOn:
    text: 'More options'
    index: 1
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: '.*Add to Collection'
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: 'QTest.*'
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: '.*Learn About Surah'
    commands:
      - tapOn:
          point: 50%,10%
      - waitForAnimationToEnd:
          timeout: 2000

# 2. Play the first surah from the playlist: the queue has two tracks.
- tapOn: '.*Collection'
- tapOn: '.*Playlists.*'
- tapOn: '.*QTest.*'
- tapOn:
    text: '.*11. Hud.*'
    index: 0
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: 'mini-player-play-pause'
    timeout: 20000

# 3. Open the full player, then the queue. Row 0 plays, so it has no ✕.
- tapOn:
    id: 'mini-player-expand'
- tapOn:
    id: 'player-queue-button'
- extendedWaitUntil:
    visible: '2 tracks'
    timeout: 5000
- assertNotVisible:
    id: 'queue-remove-0'
- assertVisible:
    id: 'queue-remove-1'

# 4. Remove the row that does not play: the count falls by one, and the
#    current track stays (no ✕ is left, and the queue still lists one track).
- tapOn:
    id: 'queue-remove-1'
- extendedWaitUntil:
    visible: '1 track'
    timeout: 5000
- assertNotVisible:
    id: 'queue-remove-1'
- assertNotVisible: '2 tracks'
- assertVisible:
    id: 'player-queue-button'
