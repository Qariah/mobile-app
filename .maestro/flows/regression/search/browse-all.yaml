# LST-04 (matrix C4) — Browse All: the full reciter grid renders and scrolls.
appId: com.qariah.app
tags:
  - regression
  - search
---
- launchApp:
    clearState: true
- runFlow: ../../../subflows/skip-onboarding.yaml
- tapOn: '.*Search'
- tapOn: 'Browse All.*'
# grid mounted — a "N qariahs" count header ("N reciters" before #535; full-match regex → wildcard)
- extendedWaitUntil:
    visible: '.*(qariahs|reciters).*'
    timeout: 6000
# grid scrolls without crashing
- scroll
- assertVisible: '.*(qariahs|reciters).*'
